version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nyaya_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///app/nyaya.db
      - JWT_SECRET=supersecretnyayaaijwttokenforindianlegaltechsystem12345
      - LLM_PROVIDER=mock
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nyaya_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
